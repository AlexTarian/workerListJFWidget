<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Workers Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #222;
    }

    .widget {
      border: 2px solid #333;
      border-radius: 18px;
      padding: 18px;
      max-width: 900px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
      align-items: end;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      border: 2px solid #333;
      border-radius: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      font-weight: 600;
    }

    .checkbox-row input {
      width: auto;
      transform: scale(1.3);
    }

    .small-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      margin-top: 12px;
      align-items: end;
    }

    button {
      border: 2px solid #333;
      border-radius: 10px;
      padding: 8px 22px;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #f1f1f1;
    }

    .worker-list {
      margin-top: 18px;
      border-top: 2px solid #333;
      padding-top: 14px;
      max-height: 300px;
      overflow-y: auto;
    }

    .worker-card {
      border: 2px solid #333;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .worker-name {
      font-size: 20px;
      font-weight: 700;
    }

    .worker-details {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .delete-btn {
      font-size: 20px;
      padding: 6px 12px;
    }

    .error {
      color: #b00020;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }

    @media (max-width: 700px) {
      .grid, .small-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="widget">
    <h2>Add Workers</h2>

    <div class="grid">
      <div class="small-row">
        <div>
          <label for="firstName">First Name<span style="color:red;">*</span></label>
          <input id="firstName" type="text" />
        </div>

        <div>
          <label for="midName">Middle Name</label>
          <input id="midName" type="text" />
        </div>
        
        <div>
          <label for="lastName">Last Name*</label>
          <input id="lastName" type="text" />
        </div>
      </div>  

      <div class="small-row">
        <div>
          <label for="status">Country of Origin</label>
          <select id="status">
            <option value="H-2A">H-2A</option>
            <option value="H-4">H-4</option>
          </select>
        </div>
        
        <div>
          <label for="country">Country of Origin</label>
          <select id="country">
            <option value="">Select country</option>
            <option value="Mexico">Mexico</option>
            <option value="South Africa">South Africa</option>
            <option value="Jamaica">Jamaica</option>
            <option value="Guatemala">Guatemala</option>
            <option value="Honduras">Honduras</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <label class="checkbox-row">
          <input id="returningWorker" type="checkbox" />
          Returning Worker
        </label>
      </div>
    </div>

    <div class="small-row">
      <div>
        <label for="phone">Phone</label>
        <input id="phone" type="tel" placeholder="+1..." />
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" type="email" />
      </div>

      <div>
        <label for="arrivalDate">Est. Arrival</label>
        <input id="arrivalDate" type="date" />
      </div>
    </div>

    <button id="addWorkerBtn" type="button">+ ADD</button>

    <div id="error" class="error"></div>

    <div id="workerList" class="worker-list"></div>
  </div>

  <script>
    const workers = [];
    let REQUIRED_WORKERS = 1;

    function getRequiredWorkerCount() {
      const fieldId = JFCustomWidget.getWidgetSetting("workerCountFieldId");

      if (!fieldId) return 1;

      try {
        const parentDoc = window.parent.document;

        const input =
          parentDoc.querySelector(`#input_${fieldId}`) ||
          parentDoc.querySelector(`[name="q${fieldId}"]`) ||
          parentDoc.querySelector(`[id*="${fieldId}"]`);

        const value = input ? input.value : "";

        return Number(value) || 1;
      } catch (error) {
        console.warn("Could not read parent Jotform field:", error);
        return 1;
      }
    }

    const fields = {
      firstName: document.getElementById("firstName"),
      lastName: document.getElementById("lastName"),
      status: document.getElementById("status"),
      country: document.getElementById("country"),
      returningWorker: document.getElementById("returningWorker"),
      phone: document.getElementById("phone"),
      email: document.getElementById("email"),
      arrivalDate: document.getElementById("arrivalDate"),
      error: document.getElementById("error"),
      workerList: document.getElementById("workerList")
    };

    document.getElementById("addWorkerBtn").addEventListener("click", addWorker);

    function addWorker() {
    if (workers.length >= REQUIRED_WORKERS) {
      fields.error.textContent =
        `You already added ${REQUIRED_WORKERS} worker(s). Remove one before adding another.`;
      return;
    }
      const worker = {
        firstName: fields.firstName.value.trim(),
        lastName: fields.lastName.value.trim(),
        country: fields.country.value,
        returningWorker: fields.returningWorker.checked,
        phone: fields.phone.value.trim(),
        email: fields.email.value.trim(),
        estimatedArrival: fields.arrivalDate.value
      };

      if (!worker.firstName || !worker.lastName || !worker.country) {
        fields.error.textContent = "First name, last name, and country are required.";
        return;
      }

      workers.push(worker);
      fields.error.textContent = "";

      clearForm();
      renderWorkers();
    }

    function deleteWorker(index) {
      workers.splice(index, 1);
      renderWorkers();
    }

    function clearForm() {
      fields.firstName.value = "";
      fields.lastName.value = "";
      fields.country.value = "";
      fields.returningWorker.checked = false;
      fields.phone.value = "";
      fields.email.value = "";
      fields.arrivalDate.value = "";
      fields.firstName.focus();
    }

    function renderWorkers() {
      fields.workerList.innerHTML = "";

      workers.forEach((worker, index) => {
        const card = document.createElement("div");
        card.className = "worker-card";

        card.innerHTML = `
          <div>
            <div class="worker-name">
              ${escapeHtml(worker.firstName)} ${escapeHtml(worker.lastName)}
            </div>
            <div class="worker-details">
              ${escapeHtml(worker.country)}
              ${worker.returningWorker ? " • Returning Worker" : ""}
              ${worker.estimatedArrival ? " • Arrival: " + escapeHtml(worker.estimatedArrival) : ""}
              ${worker.phone ? " • " + escapeHtml(worker.phone) : ""}
              ${worker.email ? " • " + escapeHtml(worker.email) : ""}
            </div>
          </div>
          <button class="delete-btn" type="button" aria-label="Delete worker">🗑</button>
        `;

        card.querySelector(".delete-btn").addEventListener("click", () => deleteWorker(index));
        fields.workerList.appendChild(card);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    JFCustomWidget.subscribe("ready", function () {
      REQUIRED_WORKERS = getRequiredWorkerCount();

      JFCustomWidget.subscribe("submit", function () {
        REQUIRED_WORKERS = getRequiredWorkerCount();

        const workerCount = workers.length;

        if (workerCount !== REQUIRED_WORKERS) {
          fields.error.textContent =
            `You must add exactly ${REQUIRED_WORKERS} worker(s). You currently have ${workerCount}.`;

          JFCustomWidget.sendSubmit({
            valid: false,
            value: ""
          });

          return;
        }

        JFCustomWidget.sendSubmit({
          valid: true,
          value: JSON.stringify({
            expectedWorkerCount: REQUIRED_WORKERS,
            actualWorkerCount: workerCount,
            workers
          })
        });
      });
    });
  </script>
</body>
</html>
