<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Workers Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    .action-row {
      display: grid;
      grid-template-columns: auto auto 1fr;
      gap: 12px;
      margin-top: 12px;
      align-items: center;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #222;
    }

    .widget {
      border: 1px solid gray;
      border-radius: 18px;
      padding: 18px;
      max-width: 900px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 28px;
      color: #0047AB;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
      align-items: end;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid gray;
      border-radius: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      font-weight: 600;
    }

    .checkbox-row input {
      width: auto;
      transform: scale(1.3);
    }

    .small-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
      align-items: end;
    }

    button {
      border: 0px solid #333;
      border-radius: 10px;
      padding: 8px 22px;
      background: #0047AB;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #5E72E4;
    }

    .worker-list {
      margin-top: 18px;
      border-top: 1px solid gray;
      padding-top: 14px;
      max-height: 300px;
      overflow-y: auto;
    }

    .worker-card {
      border: 1px solid gray;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .worker-name {
      font-size: 20px;
      font-weight: 700;
      color: #0047AB;
    }

    .h4-name {
      font-size: 20px;
      font-weight: 700;
      color: gray;
    }

    .worker-details {
      font-size: 13px;
      color: gray;
      margin-top: 4px;
    }

    .delete-btn {
      background: #D7263D;
      font-size: 20px;
      padding: 6px 12px;
      border-radius: 30px;
    }

    .error {
      color: #D7263D;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }

    @media (max-width: 420px) {
      .grid, .small-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="widget">
    <h2>Worker List Form</h2>
    <div id="recruiterView">

  <label for="recruiterSelect">Recruiter<span style="color:red;">*</span></label>
  <select id="recruiterSelect">
    <option value="">Select recruiter</option>
  </select>

  <div class="action-row">
    <button id="continueBtn" type="button">Continue</button>
    <div id="recruiterError" class="error"></div>
  </div>
</div>

<div id="workerView" style="display:none;">
  <button id="backBtn" type="button">← Back</button>

    <div class="small-row">
      <div>
        <label for="firstName">First Name<span style="color:red;">*</span></label>
        <input id="firstName" type="text" />
      </div>
        
      <div>
        <label for="lastName">Last Name<span style="color:red;">*</span></label>
        <input id="lastName" type="text" />
      </div>

      <div>
        <label for="status">Status<span style="color:red;">*</span></label>
        <select id="status">
          <option value="H-2A">H-2A</option>
          <option value="H-4">H-4</option>
        </select>
      </div>
    </div>

    <div class="small-row">
      <div>
        <label for="country">Country of Origin<span style="color:red;">*</span></label>
        <select id="country">
          <option value="">Select country</option>
        </select>
      </div>
 
      <label class="checkbox-row" id="retWorkerLabel">
      <input id="returningWorker" type="checkbox" />
        Returning Worker
      </label>

      <label class="checkbox-row" id="consFeeLabel">
      <input id="consFee" type="checkbox" checked />
        Add Consulate Fee
      </label>
    </div>

    <div class="small-row">
      <div>
        <label for="phone">Phone (w/ Country Code)<span style="color:red;">*</span></label>
        <input id="phone" type="tel" />
      </div>

      <div>
        <label for="email">Email<span style="color:red;">*</span></label>
        <input id="email" type="email" />
      </div>

      <div>
        <label for="arrivalDate">Est. Arrival<span style="color:red;">*</span></label>
        <input id="arrivalDate" type="date" />
      </div>
    </div>

    <div class="action-row">
      <button id="addWorkerBtn" type="button">+ ADD</button>
      <div id="workerCountLine" style="visibility:hidden;"><span id="workerCount">0</span>/<span id="workerTotal">0</span> workers ($<span id="costTotal">0</span>)</div>
      <div id="error" class="error"></div>
    </div>

    <div id="workerList" class="worker-list"></div>
</div>
    
  <script src="countries.js"></script>
  <script src="recruiters.js"></script>
  <script>
    const workers = [];
    let REQUIRED_WORKERS = 1;
    let selectedRecruiter = "";
    let refreshInProgress = false;
    const consFeeAmnt = 205;

    async function refreshExternalValues() {
      if (refreshInProgress) return;

      refreshInProgress = true;

      try {
        REQUIRED_WORKERS = await getRequiredWorkerCount();
        updateWorkerCountDisplay();
      } finally {
        refreshInProgress = false;
      }
    }

    function getSetting_(name) {
      try {
        return clean_(JFCustomWidget.getWidgetSetting(name));
      } catch (err) {
        console.warn(`Could not read setting ${name}:`, err);
        return "";
      }
    }

    async function getFieldValueById_(fieldId) {
      const cleanFieldId = String(fieldId || "").replace(/\D/g, "");

      if (!cleanFieldId || typeof JFCustomWidget.getFieldsValueById !== "function") {
        console.warn("Missing fieldId or getFieldsValueById unavailable:", fieldId);
        return "";
      }

      return await new Promise((resolve) => {
        try {
          JFCustomWidget.getFieldsValueById([cleanFieldId], function (response) {
            console.log("Field value response:", response);

            const data = Array.isArray(response?.data) ? response.data : [];

            const match = data.find(item =>
              String(item?.selector) === cleanFieldId ||
              String(item?.selector) === `input_${cleanFieldId}` ||
              String(item?.selector).includes(cleanFieldId)
            );

            resolve(clean_(match?.value || data[0]?.value || ""));
          });
        } catch (err) {
          console.warn("Could not read field by ID:", err);
          resolve("");
        }
      });
    }

    function clean_(value) {
      return String(value || "").trim();
    }

    function formatDate(dateString) {
      if (!dateString) return "";

      const date = new Date(dateString);

      return date.toLocaleDateString("en-US", {
        month: "2-digit",
        day: "2-digit",
        year: "numeric"
      });
    }

    function maybePrefillPhoneCode() {
      const selectedOption = fields.country.selectedOptions[0];
      const phoneCode = selectedOption?.dataset.phoneCode;

      if (phoneCode && fields.phone.value.trim().length < 5) {
        fields.phone.value = phoneCode + " ";
      }
    }

    async function getRequiredWorkerCount() {
      const fieldId = getSetting_("workerCountFieldId");
      const value = await getFieldValueById_(fieldId);

      return Number(value) || 1;
    }

    function getRecruitmentCost(country, status) {
      if (status !== "H-2A") return 0;

      const recruiter = RECRUITERS[selectedRecruiter];
      return Number(recruiter?.countries?.[country]?.rate || 0);
    }

    function calculateRecruitmentTotals() {
      const h2aWorkers = workers.filter(w => w.status === "H-2A");

      const breakdown = {};
      let totalCost = 0;

      h2aWorkers.forEach(worker => {
        const cost = getRecruitmentCost(worker.country, worker.status);
        const consFee = worker.consFee ? consFeeAmnt : 0;
        totalCost += cost + consFee;

        if (!breakdown[worker.country]) {
          breakdown[worker.country] = {
            count: 0,
            rate: cost,
            subtotal: 0
          };
        }

        breakdown[worker.country].count++;
        breakdown[worker.country].subtotal += cost + consFee;
      });

      return {
        totalWorkers: h2aWorkers.length,
        totalCost,
        breakdown
      };
    }

    const fields = {
      recruiterSelect: document.getElementById("recruiterSelect"),
      continueBtn: document.getElementById("continueBtn"),
      backBtn: document.getElementById("backBtn"),
      recruiterView: document.getElementById("recruiterView"),
      workerView: document.getElementById("workerView"),
      recruiterError: document.getElementById("recruiterError"),
      firstName: document.getElementById("firstName"),
      lastName: document.getElementById("lastName"),
      status: document.getElementById("status"),
      country: document.getElementById("country"),
      returningWorker: document.getElementById("returningWorker"),
      consFee: document.getElementById("consFee"),
      retWorkElement : document.getElementById("retWorkerLabel"),
      phone: document.getElementById("phone"),
      email: document.getElementById("email"),
      arrivalDate: document.getElementById("arrivalDate"),
      workerCount: document.getElementById("workerCount"),
      workerTotal: document.getElementById("workerTotal"),
      costTotal: document.getElementById("costTotal"),
      error: document.getElementById("error"),
      workerList: document.getElementById("workerList")
    };

    function populateRecruiterDropdown() {
      fields.recruiterSelect.innerHTML = `<option value="">Select recruiter</option>`;

      Object.keys(RECRUITERS)
        .sort()
        .forEach(recruiterName => {
          const recruiter = RECRUITERS[recruiterName];

          if (!recruiter?.countries || Object.keys(recruiter.countries).length === 0) return;

          const hasValidRate = Object.values(recruiter.countries)
            .some(country => Number(country.rate) > 0);

          if (!hasValidRate) return;

          const option = document.createElement("option");
          option.value = recruiterName;
          option.textContent = recruiterName;
          fields.recruiterSelect.appendChild(option);
        });
    }

    function populateCountryDropdownForRecruiter() {
      fields.country.innerHTML = `<option value="">Select country</option>`;

      const recruiter = RECRUITERS[selectedRecruiter];
      if (!recruiter) return;

      Object.keys(recruiter.countries)
        .sort()
        .forEach(countryName => {
          const config = recruiter.countries[countryName];

          if (!Number(config.rate)) return;

          const countryInfo = COUNTRIES.find(c => c.name === countryName);

          const option = document.createElement("option");
          option.value = countryName;
          option.textContent = `${countryName} - $${config.rate}`;
          option.dataset.phoneCode = countryInfo?.phoneCode || "";
          option.dataset.rate = config.rate;

          fields.country.appendChild(option);
        });

      fields.country.value = recruiter.defaultCountry || "";
      maybePrefillPhoneCode();
    }

    fields.continueBtn.addEventListener("click", function () {
      selectedRecruiter = fields.recruiterSelect.value;

      if (!selectedRecruiter) {
        fields.recruiterError.textContent = "Please select a recruiter.";
        return;
      }

      fields.recruiterError.textContent = "";

      populateCountryDropdownForRecruiter();

      fields.recruiterView.style.display = "none";
      fields.workerView.style.display = "block";
    });

    fields.backBtn.addEventListener("click", function () {
      if (workers.length > 0) {
        const confirmed = confirm(
          "Changing recruiters will remove all worker data. Start over?"
        );

        if (!confirmed) return;

        workers.length = 0;
        renderWorkers();
        updateWorkerCountDisplay();
        updateCostDisplay();
        syncRecruitmentDataToJotform();
      }

      selectedRecruiter = "";
      fields.recruiterSelect.value = "";
      fields.workerView.style.display = "none";
      fields.recruiterView.style.display = "block";
    });
    
    fields.status.addEventListener("change", toggleWorker);
    fields.country.addEventListener("change", async function () {
      maybePrefillPhoneCode();
      await refreshExternalValues();
    });

    document.getElementById("addWorkerBtn").addEventListener("click", async function () {
      await refreshExternalValues();
      document.getElementById("workerCountLine").style.visibility="visible";
      addWorker();
    });

    [
      fields.firstName,
      fields.lastName,
      fields.status,
      fields.phone,
      fields.email,
      fields.arrivalDate
    ].forEach(field => {
      field.addEventListener("focus", refreshExternalValues);
      field.addEventListener("change", refreshExternalValues);
    });

    function getH2ACount() {
      return workers.filter(worker => worker.status === "H-2A").length;
    }

    function getH4Count() {
      return workers.filter(worker => worker.status === "H-4").length;
    }
    
    function updateWorkerCountDisplay() {
      fields.workerCount.textContent = getH2ACount();
      fields.workerTotal.textContent = REQUIRED_WORKERS;
    }

    function updateCostDisplay() {
      const totals = calculateRecruitmentTotals();

      fields.costTotal.textContent = totals.totalCost.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      document.getElementById("workerCountLine").style.visibility =
        workers.length > 0 ? "visible" : "hidden";
    }

    function toggleWorker() {
      if (fields.status.value == "H-2A") {
        fields.returningWorker.style.visibility = "visible";
        fields.retWorkElement.style.visibility = "visible";
      } else {
        fields.returningWorker.style.visibility = "hidden";
        fields.retWorkElement.style.visibility = "hidden";
      }
    }

    function afterWorkerListChanged() {
      renderWorkers();
      updateWorkerCountDisplay();
      updateCostDisplay();
      syncRecruitmentDataToJotform();
    }

    function addWorker() {
    const selectedStatus = fields.status.value;

      if (selectedStatus === "H-2A" && getH2ACount() >= REQUIRED_WORKERS) {
        fields.error.textContent =
          `You already added ${REQUIRED_WORKERS} H-2A worker(s). Remove one before adding another.`;
        return;
      }
      
      const worker = {
        firstName: fields.firstName.value.trim(),
        lastName: fields.lastName.value.trim(),
        status: fields.status.value,
        country: fields.country.value,
        returningWorker: fields.returningWorker.checked,
        phone: fields.phone.value.trim(),
        email: fields.email.value.trim(),
        estimatedArrival: formatDate(fields.arrivalDate.value),
        recruitmentCost: getRecruitmentCost(fields.country.value, fields.status.value),
        consFee: fields.consFee.checked,
        totalWorkerCost: getRecruitmentCost(fields.country.value, fields.status.value) +
          (fields.consFee.checked && fields.status.value === "H-2A" ? consFeeAmnt : 0),
      };

      if (
        !worker.firstName ||
        !worker.lastName ||
        !worker.status ||
        !worker.country ||
        !worker.phone ||
        !worker.email ||
        !worker.estimatedArrival
      ) {
        fields.error.textContent = "Please complete all required fields before adding the worker.";
        return;
      }

      workers.push(worker);
      fields.error.textContent = "";

      clearForm();
      afterWorkerListChanged();
    }

    function deleteWorker(index) {
      workers.splice(index, 1);
      afterWorkerListChanged();
    }

    function clearForm() {
      fields.firstName.value = "";
      fields.lastName.value = "";
      fields.status.value = "H-2A";
      fields.country.value = "";
      fields.returningWorker.style.visibility = "visible";
      fields.retWorkElement.style.visibility = "visible";
      fields.returningWorker.checked = false;
      fields.consFee.checked = true;
      fields.phone.value = "";
      fields.email.value = "";
      fields.arrivalDate.value = "";
      populateCountryDropdownForRecruiter();
      updateCostDisplay();
      syncRecruitmentDataToJotform();
      fields.firstName.focus();
    }

    function renderWorkers() {
      fields.workerList.innerHTML = "";

      workers.forEach((worker, index) => {
        const card = document.createElement("div");
        card.className = "worker-card";

        card.innerHTML = `
          <div>
            <div class="${worker.status=="H-2A" ? "worker-name" : "h4-name"}">
              ${escapeHtml(worker.firstName)} ${escapeHtml(worker.lastName)}
            </div>
            <div class="worker-details">
              ${worker.country ? escapeHtml(worker.country) : ""}
              ${worker.status ? " • " + escapeHtml(worker.status) : ""}
              ${worker.returningWorker ? " • R " : ""}
              ${worker.status === "H-2A" ? ` • Cost: $${Number(worker.totalWorkerCost || 0).toLocaleString("en-US")}` : ""}
            </div>
          </div>
          <button class="delete-btn" type="button" aria-label="Delete worker">✘</button>
        `;

        card.querySelector(".delete-btn").addEventListener("click", () => deleteWorker(index));
        fields.workerList.appendChild(card);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    let initialized = false;

    async function initializeWidget() {
      if (initialized) return;
      initialized = true;

      populateRecruiterDropdown();
      toggleWorker();

      REQUIRED_WORKERS = await getRequiredWorkerCount();
      updateWorkerCountDisplay();
    }

    function syncRecruitmentDataToJotform() {
      const totals = calculateRecruitmentTotals();

      const breakdownText = Object.entries(totals.breakdown)
        .map(([country, item]) =>
          `${country}: ${item.count} x $${item.rate} = $${item.subtotal}`
        )
        .join("\n");

      try {
        JFCustomWidget.setFieldsValueByLabel([
          { label: "Selected Recruiter", value: selectedRecruiter },
          { label: "Recruitment Worker Count", value: totals.totalWorkers },
          { label: "Recruitment Total", value: totals.totalCost },
          { label: "Recruitment Breakdown", value: breakdownText }
        ]);
      } catch (err) {
        console.warn("Could not sync recruitment data to Jotform:", err);
      }
    }

    function buildReadableSubmission() {
      const lines = [];

      workers.forEach((p, i) => {
        const name = [p.firstName, p.lastName].filter(Boolean).join(" ");

        lines.push(`${i + 1}: ${name}`);
        lines.push(`${p.status} • ${p.country} • Returning: ${p.returningWorker ? "Yes" : "No"}`);
        lines.push(`${p.phone} • ${p.email}`);
        lines.push(`Est. Arrival: ${p.estimatedArrival}`);
        lines.push("");
      });

      return lines.join("\n");
    }

    document.addEventListener("DOMContentLoaded", async function () {
      await initializeWidget();
    });

    JFCustomWidget.subscribe("ready", async function () {
      await initializeWidget();

      JFCustomWidget.subscribe("submit", async function () {
        REQUIRED_WORKERS = await getRequiredWorkerCount();
        updateWorkerCountDisplay();

        const h2aCount = getH2ACount();

        if (h2aCount !== REQUIRED_WORKERS) {
          fields.error.textContent =
            `You must add exactly ${REQUIRED_WORKERS} H-2A worker(s). You currently have ${h2aCount}.`;

          JFCustomWidget.sendSubmit({
            valid: false,
            value: ""
          });

          return;
        }

        JFCustomWidget.sendSubmit({
          valid: true,
          value: buildReadableSubmission(),
        });
      });
    });
  </script>
</body>
</html>
